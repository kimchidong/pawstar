<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인증 처리 중</title>
</head>
<body style="background:#ffffff; margin:0; padding:0;">
    <div id="authResultData" 
         data-success="{{ 'true' if success else 'false' }}" 
         data-message="{{ message or '' }}" 
         data-target="{{ target_url or '' }}"
         data-error="{{ error or '' }}" style="display:none;"></div>

    <script>
    (function() {
        const authDataElem = document.getElementById('authResultData');
        const isSuccess = authDataElem ? (authDataElem.dataset.success === 'true') : false;
        const serverError = authDataElem ? authDataElem.dataset.error : '';
        const customTarget = authDataElem ? authDataElem.dataset.target : '';

        const targetProfileUrl = customTarget || '/';

        if (isSuccess) {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.location.href = targetProfileUrl;
                    window.close();
                    return;
                } catch (e) {}
            }
            location.replace(targetProfileUrl);
            return;
        }

        if (serverError) {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.alert('Google 인증 실패: ' + serverError);
                    window.close();
                    return;
                } catch (e) {}
            }
            alert('Google 인증 실패: ' + serverError);
            location.replace('/');
            return;
        }

        // 해시(#access_token) 파라미터 백업 처리
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.email) {
                    return fetch('/api/auth/google', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            google_id: data.sub || ('g_' + Math.floor(Math.random() * 1000000)),
                            email: data.email,
                            name: data.name || data.email.split('@')[0],
                            picture: data.picture || ''
                        })
                    });
                }
            })
            .then(res => res ? res.json() : null)
            .then(data => {
                const finalTarget = (data && data.target_url) || targetProfileUrl;
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.location.href = finalTarget;
                        window.close();
                        return;
                    } catch (e) {}
                }
                location.replace(finalTarget);
            })
            .catch(() => {
                if (window.opener && !window.opener.closed) {
                    try { window.opener.location.href = '/'; window.close(); return; } catch (e) {}
                }
                location.replace('/');
            });
        } else {
            if (window.opener && !window.opener.closed) {
                try { window.opener.location.href = '/'; window.close(); return; } catch (e) {}
            }
            location.replace('/');
        }
    })();
    </script>
</body>
</html>
