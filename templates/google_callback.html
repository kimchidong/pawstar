<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Google 계정 인증 중...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f8fafc;
        }
        .loading-box {
            text-align: center;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="loading-box" 
         id="authResultData"
         data-success="{{ 'true' if success else 'false' }}" 
         data-message="{{ message or '' }}" 
         data-error="{{ error or '' }}">
        <h3 style="color: #4f46e5; margin-bottom: 0.5rem;">🌐 Google 계정 인증 확인 중</h3>
        <p style="color: #64748b; font-size: 0.9rem;">잠시만 기다려주세요...</p>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const authDataElem = document.getElementById('authResultData');
        const isSuccess = authDataElem ? (authDataElem.dataset.success === 'true') : false;
        const serverMessage = authDataElem ? authDataElem.dataset.message : '';
        const serverError = authDataElem ? authDataElem.dataset.error : '';

        const isMobile = /mobile|android|iphone|ipad|ipod/i.test(navigator.userAgent);
        const targetProfileUrl = isMobile ? '/m/profile' : '/profile';

        if (isSuccess) {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.location.href = targetProfileUrl;
                    window.close();
                } catch (e) {
                    location.href = targetProfileUrl;
                }
            } else {
                location.href = targetProfileUrl;
            }
            return;
        }

        if (serverError) {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.alert('Google 인증 실패: ' + serverError);
                    window.close();
                } catch (e) {
                    alert('Google 인증 실패: ' + serverError);
                    location.href = '/';
                }
            } else {
                alert('Google 인증 실패: ' + serverError);
                location.href = '/';
            }
            return;
        }

        // 해시(#access_token) 파라미터 백업 처리
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.email) {
                    return fetch('/api/auth/google', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            google_id: data.sub || ('g_' + Math.floor(Math.random() * 1000000)),
                            email: data.email,
                            name: data.name || data.email.split('@')[0],
                            picture: data.picture || ''
                        })
                    });
                }
            })
            .then(res => res ? res.json() : null)
            .then(data => {
                if (data && data.success) {
                    if (window.opener && !window.opener.closed) {
                        try {
                            window.opener.location.href = targetProfileUrl;
                            window.close();
                        } catch (e) {
                            location.href = targetProfileUrl;
                        }
                    } else {
                        location.href = targetProfileUrl;
                    }
                } else {
                    if (window.opener && !window.opener.closed) {
                        window.opener.location.href = '/';
                        window.close();
                    } else {
                        location.href = '/';
                    }
                }
            })
            .catch(err => {
                console.error(err);
                if (window.opener && !window.opener.closed) {
                    window.opener.location.href = '/';
                    window.close();
                } else {
                    location.href = '/';
                }
            });
        } else {
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = '/';
                window.close();
            } else {
                location.href = '/';
            }
        }
    });
    </script>
</body>
</html>
